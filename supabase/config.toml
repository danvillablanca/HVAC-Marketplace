project_id = "hvac-marketplace"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
# REQ-AUT-05: el access token dura 1 h y se renueva con refresh token rotativo.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# REQ-AUT-05: la sesion expira tras 7 dias sin actividad.
[auth.sessions]
inactivity_timeout = "168h"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# REQ-AUT-06: login con Google. Para activarlo, define las variables en
# supabase/.env y VITE_GOOGLE_AUTH_ENABLED=true (ver docs/guias/despliegue.md).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.external.apple]
enabled = false

[auth.external.github]
enabled = false
